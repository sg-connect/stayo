<div class="public-page" *ngIf="!loading && !error && apartment">
  <!-- Gradient header bar -->
  <div class="page-accent"></div>

  <header class="public-header">
    <div class="header-badge">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <h1>{{ apartment.title }}</h1>
    <p class="building-name">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      {{ apartment.buildingName }}
    </p>
  </header>

  <main class="sections">
    <app-section-renderer
      *ngFor="let section of apartment.sections; let i = index"
      [section]="section"
      [style.animation-delay]="i * 80 + 'ms'"
      class="section-animated"
    />
  </main>

  <footer class="public-footer">
    <div class="footer-divider"></div>
    <div class="footer-brand">
      <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="#FF385C"/>
        <path d="M10 14.5l6-5 6 5v7.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 10 22V14.5z" fill="none" stroke="white" stroke-width="1.8"/>
        <path d="M14 23v-5h4v5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>Powered by <strong>Stayo</strong></span>
    </div>
  </footer>
</div>

<div class="public-page loading-state" *ngIf="loading">
  <div class="spinner"></div>
  <p>Loading apartment info...</p>
</div>

<div class="public-page error-state" *ngIf="error">
  <div class="error-icon">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FF385C" stroke-width="1.5">
      <circle cx="12" cy="12" r="10"/>
      <line x1="15" y1="9" x2="9" y2="15"/>
      <line x1="9" y1="9" x2="15" y2="15"/>
    </svg>
  </div>
  <h2>Apartment not found</h2>
  <p>This QR code may be outdated or invalid.<br>Please contact your host.</p>
</div>
